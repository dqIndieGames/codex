name: local3-windows-fixture-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: local3-fixture-readonly-${{ github.run_id }}
          restore-keys: |
            local3-159-windows-latest-test-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest
      - name: Check the two descendant lifecycle fixtures only
        shell: pwsh
        run: just test --cargo-profile ci-test --target x86_64-pc-windows-msvc -p codex-windows-sandbox --lib -E 'test(legacy_capture_emits_output_and_preserves_descendant_after_normal_exit) | test(legacy_tty_job_terminates_and_preserves_descendants)'
