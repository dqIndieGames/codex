name: local3-minimal-windows-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build minimal Windows package
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      # Advisory only: local3 development forbids local compilation, so this is
      # the first place formatting drift can be observed. It must not block the
      # release artifact.
      - name: Check formatting (advisory)
        shell: bash
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run local3 first-turn checklist regression tests
        shell: bash
        run: cargo test -p codex-core --lib first_turn_checklist -- --nocapture

      - name: Run named authentication account regression tests
        shell: bash
        run: |
          cargo test -p codex-core --lib auth_account -- --nocapture
          cargo test -p codex-core --lib account_store_mode_forces_file_and_rejects_conflicting_managed_policy -- --nocapture
          cargo test -p codex-cli --bin codex account_is_a_global_option_and_rejects_unsafe_names -- --nocapture
          cargo test -p codex-cli --test login named_account -- --nocapture
          cargo test -p codex-tui --lib named_auth_account_is_not_eligible_for_the_shared_local_daemon -- --nocapture
          cargo test -p codex-app-server --test all named_account_api_key_login_and_logout_use_only_named_auth_file -- --nocapture

      - name: Run image-ladder and rollout replay regression tests
        shell: bash
        run: cargo test -p codex-core --lib -- images_shrunk rollout_reconstruction image_ladder --nocapture

      - name: Run rollout and protocol tests
        shell: bash
        run: |
          cargo test -p codex-protocol
          cargo test -p codex-rollout

      - name: Run empty-completed-after-tools regression tests
        shell: bash
        env:
          # Windows debug tokio workers overflow the default stack while
          # constructing TestCodex. This does not compile the project locally.
          RUST_MIN_STACK: "33554432"
        run: |
          cargo test -p codex-core --lib empty_completed_after_tools -- --nocapture
          cargo test -p codex-core --test empty_completed_after_tools -- --nocapture

      - name: Compile Windows debug codex
        shell: bash
        run: cargo build --target x86_64-pc-windows-msvc --bin codex

      - name: Build codex.exe
        shell: bash
        run: cargo build --target x86_64-pc-windows-msvc --release --bin codex

      - name: Smoke test codex.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $exe = Join-Path $env:GITHUB_WORKSPACE "codex-rs\target\$target\release\codex.exe"
          if (-not (Test-Path $exe)) {
            throw "Missing built binary: $exe"
          }

          $cargoToml = Get-Content "Cargo.toml" -Raw
          $expectedVersion = [regex]::Match($cargoToml, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw "Failed to read expected version from codex-rs/Cargo.toml"
          }
          $expectedDisplayVersion = "$expectedVersion-local3"

          $version = & $exe --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Write-Host $version
          if ($version -notmatch [regex]::Escape($expectedDisplayVersion)) {
            throw "Expected $expectedDisplayVersion version output from $exe, got: $version"
          }

          $helpText = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($helpText -notmatch '--account <NAME>') {
            throw 'Expected global --account <NAME> in codex.exe help output'
          }

          $accountHome = Join-Path $env:RUNNER_TEMP ("codex-account-smoke-" + [guid]::NewGuid().ToString('N'))
          $previousCodexHome = $env:CODEX_HOME
          try {
            New-Item -ItemType Directory -Force -Path $accountHome | Out-Null
            $env:CODEX_HOME = $accountHome
            'sk-default-smoke' | & $exe -c 'forced_login_method="api"' login --with-api-key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $defaultAuthPath = Join-Path $accountHome 'auth.json'
            $defaultAuthHash = (Get-FileHash -LiteralPath $defaultAuthPath -Algorithm SHA256).Hash
            foreach ($entry in @(
              @{ Name = 'alpha'; Key = 'sk-alpha-smoke' },
              @{ Name = 'beta'; Key = 'sk-beta-smoke' }
            )) {
              $entry.Key | & $exe --account $entry.Name -c 'forced_login_method="api"' login --with-api-key
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $authPath = Join-Path $accountHome ("accounts\{0}\auth.json" -f $entry.Name)
              if (-not (Test-Path -LiteralPath $authPath)) {
                throw "Missing named account auth file: $authPath"
              }
            }
            if ((Get-FileHash -LiteralPath $defaultAuthPath -Algorithm SHA256).Hash -ne $defaultAuthHash) {
              throw 'Named account login unexpectedly modified the default auth.json'
            }
            $statusProcesses = foreach ($accountName in @('alpha', 'beta')) {
              $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
              $startInfo.FileName = $exe
              $startInfo.UseShellExecute = $false
              $startInfo.CreateNoWindow = $true
              $startInfo.Environment['CODEX_HOME'] = $accountHome
              $startInfo.ArgumentList.Add('--account')
              $startInfo.ArgumentList.Add($accountName)
              $startInfo.ArgumentList.Add('login')
              $startInfo.ArgumentList.Add('status')
              [System.Diagnostics.Process]::Start($startInfo)
            }
            foreach ($process in $statusProcesses) {
              $process.WaitForExit()
              if ($process.ExitCode -ne 0) {
                throw "Concurrent named account status failed with exit code $($process.ExitCode)"
              }
            }
            & $exe --account alpha login status
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe --account alpha logout
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (Test-Path -LiteralPath (Join-Path $accountHome 'accounts\alpha\auth.json')) {
              throw 'Named account logout did not remove alpha auth.json'
            }
            & $exe --account beta login status
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $daemonError = (& $exe --account beta app-server daemon version 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -or $daemonError -notmatch 'named accounts use an embedded app-server') {
              throw 'Named account daemon lifecycle command was not rejected explicitly'
            }
            $proxyError = (& $exe --account beta app-server proxy 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -or $proxyError -notmatch 'named accounts use an embedded app-server') {
              throw 'Named account app-server proxy was not rejected explicitly'
            }
          }
          finally {
            $env:CODEX_HOME = $previousCodexHome
          }

      - name: Package codex.exe
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $source = Join-Path $env:GITHUB_WORKSPACE "codex-rs\target\$target\release\codex.exe"
          if (-not (Test-Path $source)) {
            throw "Missing built binary: $source"
          }

          $stage = Join-Path $dist "codex-$target"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $stage 'codex.exe') -Force

          $zipName = "codex-$target-minimal.zip"
          $zip = Join-Path $dist $zipName
          if (Test-Path $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage 'codex.exe') -DestinationPath $zip -Force
          "zip_path=dist/$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows codex.exe artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: local3-windows-codex-exe
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7
