name: local3-minimal-windows-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build minimal Windows package
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Restore Rust build cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: local3-160-windows-latest-build-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            local3-160-windows-latest-build-${{ hashFiles('codex-rs/Cargo.lock') }}-
            local3-160-windows-latest-build-
            local3-159-windows-latest-build-

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure official sandboxed V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Build codex.exe
        shell: bash
        run: cargo build --target x86_64-pc-windows-msvc --release --bin codex

      - name: Package codex.exe
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $source = Join-Path $env:GITHUB_WORKSPACE "codex-rs\target\$target\release\codex.exe"
          if (-not (Test-Path $source)) {
            throw "Missing built binary: $source"
          }

          $stage = Join-Path $dist "codex-$target"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $stage 'codex.exe') -Force

          $zipName = "codex-$target-minimal.zip"
          $zip = Join-Path $dist $zipName
          if (Test-Path $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage 'codex.exe') -DestinationPath $zip -Force
          "zip_path=dist/$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows codex.exe artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: local3-windows-codex-exe
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Save Rust build cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: local3-160-windows-latest-build-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
